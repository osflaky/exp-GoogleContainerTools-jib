name: Unit Tests
on:
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - java: 8
          os: windows-latest
          arch: arm64
          runner: windows-11-arm
          expander_leg: windows-latest-8-arm64
    env:
      # for gradle
      TERM: dumb
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 2
    - uses: actions/setup-java@v4
      with:
          # AdoptOpenJDK publishes no Windows ARM64 builds; Zulu provides native
          # Windows aarch64 JDKs (including Java 8) for the windows-11-arm runner.
        distribution: ${{ (matrix.os == 'windows-latest' && matrix.arch == 
          'arm64') && 'zulu' || 'adopt' }}
        java-version: ${{ matrix.java }}
        architecture: ${{ matrix.arch == 'arm64' && 'aarch64' || 'x64' }}
    - uses: actions/cache@v4
      with:
        path: |
          ~/.m2/repository
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', 
          '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
    - name: Run tests
      run: |
        ./gradlew clean build jacocoTestReport --stacktrace
    name: unit-tests [${{ matrix.expander_leg }}]
    timeout-minutes: 150
