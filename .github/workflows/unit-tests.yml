name: Unit Tests
on:
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - java: 11
          os: macos-latest
          arch: arm64
          runner: macos-latest
          expander_leg: macos-latest-11-arm64
    env:
      # for gradle
      TERM: dumb
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 2
    - uses: actions/setup-java@v3
      with:
        distribution: 'adopt'
        java-version: ${{ matrix.java }}
    - uses: actions/cache@v4
      with:
        path: |
          ~/.m2/repository
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', 
          '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
    - name: Run tests
      run: |
        ./gradlew clean build jacocoTestReport --stacktrace
    name: unit-tests [${{ matrix.expander_leg }}]
    timeout-minutes: 150
